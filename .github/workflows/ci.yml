name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps + SDK
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          maturin develop
          mom-ping

      - name: Production matrix
        run: python scripts/helpers/bench/prod_matrix.py

      - name: Adapter unit tests (mocked HTTP)
        run: pytest -q scripts/tests/test_prod_adapters.py scripts/tests/test_sdk_surface.py

      - name: Done-means gates
        run: python scripts/helpers/bench/done_means.py
