[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "mom"
version = "0.1.0"
description = "Mixture of Models — latency-transparent composition SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Aquin Labs Private Limited" }]
requires-python = ">=3.10"
keywords = ["mom", "mixture-of-models", "routing", "speculation", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.0", "respx>=0.21"]
server = ["starlette>=0.37", "uvicorn>=0.27"]

[project.urls]
Homepage = "https://github.com/aquinlabs/mom"
Documentation = "https://github.com/aquinlabs/mom/tree/main/docs"
Repository = "https://github.com/aquinlabs/mom"

[project.scripts]
mom-ping = "mom.__main__:main"
mom-serve = "mom.server:main"

[tool.maturin]
manifest-path = "src/crates/mom-py/Cargo.toml"
module-name = "mom._native"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["src", "."]
