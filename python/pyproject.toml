[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mom"
version = "0.1.0"
description = "Mixture of Models — Python surface for latency-transparent composition"
readme = "../README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Aquin Labs Private Limited" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mom*"]

