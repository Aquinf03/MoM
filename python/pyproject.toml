[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "mom"
version = "0.1.0"
description = "Mixture of Models — Python surface for latency-transparent composition"
readme = "../README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Aquin Labs Private Limited" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.maturin]
manifest-path = "../crates/mom-py/Cargo.toml"
module-name = "mom._native"
python-source = "."
